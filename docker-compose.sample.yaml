services:
  xboard:
    # build:
    #   context: .
    image: ghcr.io/linusxiong/xboard:latest
    restart: unless-stopped
    volumes:
      # Create .env from .env.example before starting the stack.
      - ./.env:/www/.env
      - ./storage:/www/storage
      - ./bootstrap/cache:/www/bootstrap/cache
      - redis-socket:/run/redis-socket
    environment:
      docker: "true"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7001:7001"

  redis:
    build:
      context: .docker/services/redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - redis-socket:/run/redis-socket
    healthcheck:
      test: ["CMD", "redis-cli", "-s", "/run/redis-socket/redis.sock", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  redis-socket:
